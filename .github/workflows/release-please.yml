---
name: release-please

permissions:
  contents: write
  issues: write
  pull-requests: write

on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          token: ${{ secrets.GH_PAT_RESUME_RELEASE_PLEASE }}
