---
name: release-please

permissions:
  contents: write
  issues: write
  pull-requests: write

on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.GH_PAT_RESUME_RELEASE_PLEASE }}
